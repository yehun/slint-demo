[workspace]
members = [
    "crates/slint-common",
    "crates/slint-fs",
    "crates/slint-file-picker",
    "crates/slint-tts",
    "crates/article-02",
    "crates/article-03",
    "crates/article-04",
    "crates/article-05",
    "crates/article-06",
    "crates/article-07",
    "crates/article-08",
    "crates/article-09",
    "crates/article-10",
    "crates/article-11",
    "crates/article-12",
    "crates/article-13",
    "crates/article-14",
    "crates/article-15",
    "crates/article-16",
]
resolver = "2"

# 共享依赖版本, 各 crate 只需写 version.workspace = true
[workspace.dependencies]
# 使用 master 分支 (与 yehun-slint 一致)
slint = { git = "https://github.com/slint-ui/slint.git", branch = "master", features = ["gettext", "accessibility", "renderer-software"] }
slint-build = { git = "https://github.com/slint-ui/slint.git", branch = "master" }
jni = "0.22"
calamine = "0.30"
csv = "1.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = "0.3"
js-sys = "0.3"
