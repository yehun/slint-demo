[package]
name = "article-17"
version = "0.1.0"
edition = "2024"
authors = ["yehun"]
description = "第十七篇, Slint OCR 文字识别 —— 本地 PP-OCRv4 (det/cls/rec) onnxruntime 推理: 图片 → 检测框 + 文本"
build = "build.rs"

[dependencies]
slint = { workspace = true }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
parking_lot = "0.12"
slint-ocr = { path = "../slint-ocr" }
slint-file-picker = { path = "../slint-file-picker" }
slint-fs = { path = "../slint-fs" }
# 预览图绘制检测框 + 保存 PNG
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }

[build-dependencies]
slint-build = { workspace = true }

[features]
default = ["desktop"]
desktop = []
android = ["slint/backend-android-activity-06"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
path = "src/main.rs"
name = "article_17"

# ===== Android 构建配置 =====
# 注意: Android 下 ort 不能 load-dynamic, 需要自备编译好的 libonnxruntime
# (见 ../../slint-tts/Cargo.toml 的 target 段说明)
[package.metadata.android]
use_aapt2 = true
use_gradle = true
package = "com.example.article17"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 30
target_sdk_version = 35
compile_sdk_version = 35
java_sources = "android/java"

[package.metadata.android.application]
label = "Article 17 - OCR"

[[package.metadata.android.application.activity]]
name = "com.example.article17.MainActivity"
orientation = "portrait"
launch_mode = "singleTop"
config_changes = "uiMode|screenSize|screenLayout|density|keyboard|keyboardHidden"
exported = true
resizeable_activity = false
always_retain_task_state = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.app.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "article_17"

[package.metadata.android.signing.release]
path = "../../assets/keystore/debug.keystore"
keystore_password = "android"
