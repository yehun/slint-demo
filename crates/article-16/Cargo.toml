[package]
name = "article-16"
version = "0.1.0"
edition = "2024"
authors = ["yehun"]
description = "第十六篇, Slint 语音克隆 —— 本地零样本 TTS (LuxTTS ONNX): 参考音频 + 转写 + 文本 → 48kHz 波形"
build = "build.rs"

[dependencies]
slint = { workspace = true }
log = "0.4"
env_logger = "0.11"
rodio = "0.20"
anyhow = "1"
parking_lot = "0.12"
slint-lux-tts = { path = "../slint-lux-tts" }
slint-file-picker = { path = "../slint-file-picker" }
slint-fs = { path = "../slint-fs" }

[build-dependencies]
slint-build = { workspace = true }

[features]
default = ["desktop"]
desktop = []
android = ["slint/backend-android-activity-06"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
path = "src/main.rs"
name = "article_16"

# ===== Android 构建配置 =====
# 注意: Android 下 ort 不能 load-dynamic, 需要自备编译好的 libonnxruntime
# (见 ../../slint-lux-tts/Cargo.toml 的 target 段说明)
[package.metadata.android]
use_aapt2 = true
use_gradle = true
package = "com.example.article16"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 30
target_sdk_version = 35
compile_sdk_version = 35
java_sources = "android/java"

[package.metadata.android.application]
label = "Article 16 - Voice Clone"

[[package.metadata.android.application.activity]]
name = "com.example.article16.MainActivity"
orientation = "portrait"
launch_mode = "singleTop"
config_changes = "uiMode|screenSize|screenLayout|density|keyboard|keyboardHidden"
exported = true
resizeable_activity = false
always_retain_task_state = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.app.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "article_16"

[package.metadata.android.signing.release]
path = "../../assets/keystore/debug.keystore"
keystore_password = "android"
